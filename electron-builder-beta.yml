appId: com.kevlaws.katiesamp
productName: KatiesAmp
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
electronVersion: 43.7.0
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - 'package.json'
extraResources:
    - assets/**
asarUnpack:
    - resources/**
win:
    target:
        - target: nsis
          arch:
              - x64
    icon: assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

npmRebuild: false
publish:
    provider: github
    owner: kevlaws
    repo: feishin
    channel: beta
    releaseType: draft
