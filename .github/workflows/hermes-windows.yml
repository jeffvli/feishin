# Builds the Hermes Music edition of Feishin for Windows and Linux on every push to this branch
# and publishes the downloads as one GitHub release (no GitHub account needed to download).
name: Hermes build (Windows + Linux)

on:
    push:
        branches:
            - hermes-music-video
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Build for Windows
              run: pnpm run package:win:pr

            - name: Upload Windows build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-windows
                  path: dist/*.exe

    linux:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Build for Linux
              run: pnpm run package:linux:pr

            - name: Upload Linux build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-linux
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.tar.xz

    lint-report:
        # Runs Feishin's checks and posts any problems as annotations (readable without signing in).
        runs-on: ubuntu-latest
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Check and report
              shell: bash
              run: |
                  for check in typecheck lint-code lint-styles; do
                      pnpm run "$check" > "$check.txt" 2>&1 || true
                      echo "::notice title=$check::$(tail -n 1 "$check.txt")"
                      { grep -E "error|warning|TS[0-9]{4}|\.tsx?[:(]|\.css" "$check.txt" || true; } | grep -v "^>" | head -40 | while IFS= read -r line; do
                          echo "::warning title=$check::$line"
                      done || true
                  done

    release:
        needs: [windows, linux]
        runs-on: ubuntu-latest
        steps:
            - name: Collect the builds
              uses: actions/download-artifact@v5
              with:
                  path: dist
                  merge-multiple: true

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: hermes-${{ github.run_number }}
                  name: Feishin (Hermes Music edition) build ${{ github.run_number }}
                  body: |
                      Feishin with Hermes Music video sync and Group Play.

                      **Windows:** download `Feishin-1.17.0-win-x64.exe` (most PCs). If Windows warns that the app is
                      unrecognised, click More info > Run anyway.

                      **Linux:**
                      - Any distro: `Feishin-linux-x86_64.AppImage` - make it executable
                        (`chmod +x Feishin-linux-x86_64.AppImage`) and run it.
                      - Ubuntu / Debian / Mint: `Feishin-linux-amd64.deb` - install with
                        `sudo apt install ./Feishin-linux-amd64.deb`.
                      - Or unpack `Feishin-linux-x64.tar.xz` and run `feishin` inside.

                      Then in Feishin: Settings > General > Music videos > Hermes Music address.
                  files: dist/*
