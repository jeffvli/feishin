# Builds Sour Player (the Hermes Music edition of Feishin) for Windows, Linux and macOS on every push to this branch
# and publishes the downloads as one GitHub release (no GitHub account needed to download).
name: Hermes build (Windows + Linux)

on:
    push:
        branches:
            - hermes-music-video
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Set the version (Sour Lemon 0.x; each build is newer, so installed copies update themselves)
              shell: bash
              run: npm pkg set version=0.6.$(( ${{ github.run_number }} - 33 ))

            - name: Build for Windows
              run: pnpm run package:win:pr

            - name: Upload Windows build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-windows
                  path: |
                      dist/*.exe
                      dist/*.exe.blockmap
                      dist/latest.yml

    linux:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Set the version (Sour Lemon 0.x; each build is newer, so installed copies update themselves)
              shell: bash
              run: npm pkg set version=0.6.$(( ${{ github.run_number }} - 33 ))

            - name: Build for Linux
              run: pnpm run package:linux:pr

            - name: Upload Linux build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-linux
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.tar.xz
                      dist/latest-linux.yml

    mac:
        # macOS build (not signed by Apple: first open with right-click > Open). No automatic updates on Mac.
        runs-on: macos-latest
        continue-on-error: true
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Set the version
              shell: bash
              run: npm pkg set version=0.6.$(( ${{ github.run_number }} - 33 ))

            - name: Build for macOS
              run: pnpm run package:mac:pr

            - name: Upload macOS build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-mac
                  path: |
                      dist/*.dmg
                      dist/*-mac.zip

    lint-report:
        # Runs Feishin's checks and posts any problems as annotations (readable without signing in).
        runs-on: ubuntu-latest
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Check and report
              shell: bash
              run: |
                  for check in typecheck lint-code lint-styles; do
                      pnpm run "$check" > "$check.txt" 2>&1 || true
                      echo "::notice title=$check::$(tail -n 1 "$check.txt")"
                      { grep -E "error|warning|TS[0-9]{4}|\.tsx?[:(]|\.css|^ +[0-9]+:[0-9]+" "$check.txt" || true; } | grep -v "^>" | head -40 | while IFS= read -r line; do
                          echo "::warning title=$check::$line"
                      done || true
                  done

    release:
        needs: [windows, linux, mac]
        if: always() && needs.windows.result == 'success' && needs.linux.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Collect the builds
              uses: actions/download-artifact@v5
              with:
                  path: dist
                  merge-multiple: true

            - name: Work out the version
              id: version
              run: echo "v=0.6.$(( ${{ github.run_number }} - 33 ))" >> "$GITHUB_OUTPUT"

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.v }}
                  name: Sour Player - Sour Lemon v${{ steps.version.outputs.v }}
                  make_latest: true
                  body: |
                      Sour Player: the music player for Hermes Music (built on Feishin).

                      **New in 0.6:** Sour Player updates itself (when nothing has played for a minute; turn it
                      off in Settings > Sour Player); report a bug or suggest something from Settings (admins see
                      them all); your own picture or GIF behind Home; a see-through option for playlist colours;
                      30 more fonts; every Hermes Music command (/help, /follow, /fix-all, /issues...) works in
                      Request music, plus YouTube playlist and profile links; a themed playlist's picture shows
                      in the Sour Stage even when you press play without opening it; the Stage's Scene and
                      Visualizer menus are easier to click; the mini player stays on top on Linux and shows the
                      cover on macOS. Needs Hermes Music 3.5 for reports, playlist opacity and the new commands.

                      **New in 0.5.3:** the Discord status says Sour Player, with its own icon.

                      **New in 0.5.2:** karaoke instrumentals stay in step with the song (with a "music -/+"
                      nudge per song) at the same loudness as the song (needs Hermes Music 3.4.1); the heart button for playing as the SOUL is back; the mini player's loop
                      icon shows.

                      **New in 0.5.1:** karaoke fades the vocals out (the instrumental plays in step with
                      the song, and instrumentals no longer show up as songs in the library); the sung line
                      fills word by word in every lyric style; the mini player has loop and volume; a themed
                      playlist's picture is the Sour Stage backdrop while it plays; steer the SOUL with the
                      arrow keys, WASD or the mouse straight away; no subtitles on music videos; hide
                      playlists from the sidebar (right-click); a Discord status switch (Settings > Sour Player);
                      the listen along chip sits inside the player bar. Needs Hermes Music 3.4 for karaoke.

                      **New in 0.5:** Simple mode (Settings > Sour Player) for anyone who finds all the
                      extras confusing; lyrics now open in the Sour Stage, with lyric timing, other lyric
                      sources and a fixed karaoke mode where each word fills as it's sung (Sing it plays the
                      song's instrumental; Hermes Music's new /karaoke gets one); the player bar visualizer can
                      be Cover halo, Pulp burst or Album glow; Hermes Music asks "Is this the song?" when it
                      isn't sure, instead of giving up; Follow buttons on artist pages; Navidrome admins get
                      the admin extras and a royal blue name; a rounded app icon. Fixed: removing favourites
                      from your profile, following artists, listening along while joining Group Play (it now
                      asks first), the mini player being huge on some Linux desktops, pinned AppImages not
                      opening, missing themes in the Sour Studio, app fonts, and the floating player bar being
                      cut off. Needs Hermes Music 3.3 for the new request and admin features.

                      **New in 0.4:** your Sour profile is your Navidrome account (same profile on every
                      computer, duplicates merge by themselves); 27 skins and holiday decorations; the Sour Studio
                      (skins, visualizers, layout, fonts, app icon); the Sour Stage (full screen now playing with
                      synced lyrics, karaoke, vinyl, scenes, A-B loop, slowed and nightcore); seven visualizers; a
                      rebuilt mini player and a tidier player bar; the Sour Hub (feed, hot seat, duels and the Hall
                      of Fame, gifts, time capsules, taste map, request tracker); the Sour Library (cover wall,
                      record shelf, timeline, smart folders, tag and cover fixing, timed lyrics, mood bundles);
                      bigger Group Play rooms (encore, soundboard, tokens, request line, blind rounds, theme
                      nights, countdown, spectators, session scrapbook); new Home sections; profile heatmaps,
                      eras and duo stats; 30 new fonts; colour emoji everywhere. Needs Hermes Music 3.1.

                      **Already have Sour Player?** It downloads this version in the background and shows an
                      **Update** button in the player bar - click it to restart into the new version.

                      **Windows:** download `Sour-Player-win-x64.exe` (almost every PC). If Windows says the app
                      is unrecognised, click More info > Run anyway.

                      **Linux:**
                      - Any distro: `Sour-Player-linux-x86_64.AppImage` - make it executable
                        (`chmod +x Sour-Player-linux-x86_64.AppImage`) and run it. Updates itself.
                      - Ubuntu / Debian / Mint: `Sour-Player-linux-amd64.deb` - install with
                        `sudo apt install ./Sour-Player-linux-amd64.deb`. Updates itself.
                      - Or unpack `Sour-Player-linux-x64.tar.xz` and run `sour-player` inside (no updates).

                      **macOS (new, test):** download the `.dmg` - it isn't signed by Apple, so the first time
                      right-click Sour Player > Open. Updates on Mac are a fresh download.

                      Coming from Feishin? Sour Player copies your Feishin settings the first time it starts.
                      Then: Settings > General > Music videos > Hermes Music address.
                  files: dist/*
