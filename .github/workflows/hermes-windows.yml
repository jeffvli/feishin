# Builds Sour Player (the Hermes Music edition of Feishin) for Windows and Linux on every push to this branch
# and publishes the downloads as one GitHub release (no GitHub account needed to download).
name: Hermes build (Windows + Linux)

on:
    push:
        branches:
            - hermes-music-video
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows:
        runs-on: windows-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Set the version (Sour Lemon 0.x; each build is newer, so installed copies update themselves)
              shell: bash
              run: npm pkg set version=0.2.$(( ${{ github.run_number }} - 20 ))

            - name: Build for Windows
              run: pnpm run package:win:pr

            - name: Upload Windows build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-windows
                  path: |
                      dist/*.exe
                      dist/*.exe.blockmap
                      dist/latest.yml

    linux:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Set the version (Sour Lemon 0.x; each build is newer, so installed copies update themselves)
              shell: bash
              run: npm pkg set version=0.2.$(( ${{ github.run_number }} - 20 ))

            - name: Build for Linux
              run: pnpm run package:linux:pr

            - name: Upload Linux build
              uses: actions/upload-artifact@v7
              with:
                  name: feishin-hermes-linux
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.tar.xz
                      dist/latest-linux.yml

    lint-report:
        # Runs Feishin's checks and posts any problems as annotations (readable without signing in).
        runs-on: ubuntu-latest
        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Check and report
              shell: bash
              run: |
                  for check in typecheck lint-code lint-styles; do
                      pnpm run "$check" > "$check.txt" 2>&1 || true
                      echo "::notice title=$check::$(tail -n 1 "$check.txt")"
                      { grep -E "error|warning|TS[0-9]{4}|\.tsx?[:(]|\.css|^ +[0-9]+:[0-9]+" "$check.txt" || true; } | grep -v "^>" | head -40 | while IFS= read -r line; do
                          echo "::warning title=$check::$line"
                      done || true
                  done

    release:
        needs: [windows, linux]
        runs-on: ubuntu-latest
        steps:
            - name: Collect the builds
              uses: actions/download-artifact@v5
              with:
                  path: dist
                  merge-multiple: true

            - name: Work out the version
              id: version
              run: echo "v=0.2.$(( ${{ github.run_number }} - 20 ))" >> "$GITHUB_OUTPUT"

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.v }}
                  name: Sour Player - Sour Lemon v${{ steps.version.outputs.v }}
                  make_latest: true
                  body: |
                      Sour Player: the music player for Hermes Music (built on Feishin).

                      **Already have Sour Player?** It downloads this version in the background and shows an
                      **Update** button in the player bar - click it to restart into the new version.

                      **Windows:** download `Sour-Player-win-x64.exe` (almost every PC). If Windows says the app
                      is unrecognised, click More info > Run anyway.

                      **Linux:**
                      - Any distro: `Sour-Player-linux-x86_64.AppImage` - make it executable
                        (`chmod +x Sour-Player-linux-x86_64.AppImage`) and run it. Updates itself.
                      - Ubuntu / Debian / Mint: `Sour-Player-linux-amd64.deb` - install with
                        `sudo apt install ./Sour-Player-linux-amd64.deb`. Updates itself.
                      - Or unpack `Sour-Player-linux-x64.tar.xz` and run `sour-player` inside (no updates).

                      Coming from Feishin? Sour Player copies your Feishin settings the first time it starts.
                      Then: Settings > General > Music videos > Hermes Music address.
                  files: dist/*
