name: Build and Release Feishin Android APK

on:
  push:
    branches:
      - feat/server-custom-headers
      - feat/android-poc
      - development
      - main
    tags:
      - 'android-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: false
        default: 'android-v1.15.1-poc'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk feishin-android-v1.15.1-poc.apk
          ls -lh feishin-android-v1.15.1-poc.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishin-android-apk
          path: feishin-android-v1.15.1-poc.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="android-v1.15.1-poc"
            fi
          fi

          NOTES=$(cat << 'BODY'
          ## Feishin Android POC (v1.15.1)

          Hyper-performant Android client POC for Feishin (`https://feishin.srvr.club/`).

          ### Key Features & Architecture
          - **Large Library UI Acceleration**: Enabled hardware acceleration, offscreen tile pre-rasterization (`setOffscreenPreRaster(true)`), and Android large heap (`android:largeHeap="true"`) to guarantee silky-smooth scrolling through 10,000+ tracks and virtualized album grids without stutter.
          - **Cloudflare Access & Session Persistence**: Integrated with Android `CookieManager` third-party cookie persistence to seamlessly handle Cloudflare Access authentication (`srvrlab.cloudflareaccess.com`) and keep sessions alive.
          - **Background Playback & Native Media Controls**: Native Android foreground media service (`FeishinMediaService`) with `PARTIAL_WAKE_LOCK`, lockscreen notifications, and media action transport controls (Play/Pause/Skip).
          - **Configurable Server URL**: Long-press or error-screen prompt allows dynamic reconfiguration of server endpoints.
          - **Edge-to-Edge Design**: Full immersive layout with safe-area padding and SPA back-navigation handling.
          BODY
          )

          # Delete pre-existing release if clobbering existing tag
          gh release delete "$TAG" --yes || true
          git tag -f "$TAG" || true
          git push origin "$TAG" -f || true

          gh release create "$TAG" feishin-android-v1.15.1-poc.apk \
            --title "Feishin Android v1.15.1 POC" \
            --notes "$NOTES"
