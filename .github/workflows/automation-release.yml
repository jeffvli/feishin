name: KatiesAmp Release

on:
    workflow_dispatch:
        inputs:
            channel:
                description: Release channel
                required: true
                default: beta
                type: choice
                options:
                    - beta
                    - release
            version:
                description: Optional base or exact version, for example 0.1.4-beta.14
                required: false
                type: string

permissions:
    contents: write

jobs:
    checks:
        name: Run full validation
        uses: ./.github/workflows/automation-full.yml

    release:
        name: Publish Windows x64
        needs: checks
        runs-on: windows-latest
        timeout-minutes: 45
        env:
            DISABLE_AUTO_UPDATES: '1'
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
            WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        steps:
            - name: Require the development branch
              shell: pwsh
              run: |
                  if ('${{ github.ref_name }}' -ne 'development') {
                      throw 'Releases must be started from the development branch.'
                  }

            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve release version
              id: version
              shell: pwsh
              run: |
                  $env:KATIESAMP_RELEASE_CHANNEL = '${{ inputs.channel }}'
                  $env:KATIESAMP_REQUESTED_VERSION = '${{ inputs.version }}'.Trim()
                  $env:KATIESAMP_CURRENT_VERSION = (Get-Content package.json | ConvertFrom-Json).version
                  $releaseTags = @(
                      gh release list --limit 100 --json tagName |
                          ConvertFrom-Json |
                          ForEach-Object { $_.tagName }
                  )
                  $env:KATIESAMP_RELEASE_TAGS = ConvertTo-Json -InputObject $releaseTags -Compress
                  $resolved = node scripts/automation/resolve-release-version.mjs | ConvertFrom-Json

                  "version=$($resolved.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  "tag=$($resolved.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  "manifest=$($resolved.manifest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            - name: Set application version
              run: node scripts/automation/set-version.mjs "${{ steps.version.outputs.version }}"

            - name: Download the previous beta installer
              if: inputs.channel == 'beta'
              id: previous-beta
              shell: pwsh
              run: |
                  $previousTag = gh release list --limit 100 --json tagName,isPrerelease |
                      ConvertFrom-Json |
                      Where-Object { $_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+-beta\.\d+$' } |
                      Select-Object -First 1 -ExpandProperty tagName

                  if (-not $previousTag) {
                      Write-Host 'No previous beta release exists, so replacement testing is not applicable.'
                      exit 0
                  }

                  $downloadDirectory = Join-Path $PWD 'test-results/beta-replacement'
                  New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
                  gh release download $previousTag --pattern 'KatiesAmp-*-win-x64.exe' --dir $downloadDirectory
                  $installer = Get-ChildItem -LiteralPath $downloadDirectory -Filter '*.exe' |
                      Select-Object -First 1
                  if (-not $installer) {
                      throw "Release $previousTag does not contain a Windows x64 installer."
                  }

                  "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  "tag=$previousTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            - name: Build Windows x64 installer
              shell: pwsh
              run: |
                  pnpm run build
                  $config = if ('${{ inputs.channel }}' -eq 'beta') {
                      'electron-builder-beta.yml'
                  } else {
                      'electron-builder.yml'
                  }
                  pnpm exec electron-builder --config $config --win --x64 --publish never

            - name: Measure packaged Windows performance
              shell: pwsh
              run: |
                  $env:KATIESAMP_EXECUTABLE_PATH = (Resolve-Path 'dist/win-unpacked/KatiesAmp.exe').Path
                  $env:KATIESAMP_TEST_OUTPUT_ROOT = 'test-results/electron/packaged-performance'
                  pnpm run test:ui:performance

            - name: Verify packaged application and update files
              shell: pwsh
              run: scripts/automation/verify-windows-package.ps1 -ManifestName '${{ steps.version.outputs.manifest }}'

            - name: Verify Windows installer lifecycle
              shell: pwsh
              run: scripts/automation/verify-windows-installer.ps1 -ManifestName '${{ steps.version.outputs.manifest }}'

            - name: Verify beta-to-beta installer replacement
              if: inputs.channel == 'beta' && steps.previous-beta.outputs.installer != ''
              shell: pwsh
              run: scripts/automation/verify-beta-replacement.ps1 -PreviousInstallerPath '${{ steps.previous-beta.outputs.installer }}' -ManifestName '${{ steps.version.outputs.manifest }}' -ExpectedVersion '${{ steps.version.outputs.version }}'

            - name: Generate SHA-256 checksums
              shell: pwsh
              run: |
                  Get-ChildItem dist -File |
                      Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
                      ForEach-Object {
                          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
                          "$hash  $($_.Name)"
                      } | Set-Content -LiteralPath dist/SHA256SUMS.txt

            - name: Upload release evidence
              uses: actions/upload-artifact@v7
              with:
                  name: katiesamp-${{ steps.version.outputs.version }}-windows-x64
                  path: |
                      dist/*.exe
                      dist/*.blockmap
                      dist/*.yml
                      dist/SHA256SUMS.txt
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload performance evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katiesamp-performance-${{ github.run_id }}
                  path: test-results/electron
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Publish GitHub release
              shell: pwsh
              run: |
                  $assets = Get-ChildItem dist -File |
                      Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml', '.txt' } |
                      ForEach-Object { $_.FullName }
                  $arguments = @(
                      'release', 'create', '${{ steps.version.outputs.tag }}',
                      '--target', '${{ github.sha }}',
                      '--title', 'KatiesAmp ${{ steps.version.outputs.tag }}',
                      '--generate-notes'
                  )
                  if ('${{ inputs.channel }}' -eq 'beta') {
                      $arguments += '--prerelease'
                  }
                  $arguments += $assets
                  & gh @arguments
